name: Daily Support Program Monitor

on:
  schedule:
    # 매일 한국시간(KST) 오전 07:20 실행 (UTC 22:20) - 정각 트래픽 혼잡 회피
    - cron: '20 22 * * *'
  push:
    branches: [ main ]
    paths:
      - 'monitor.py'
      - 'config.json'
  workflow_dispatch: # GitHub 웹페이지 및 대시보드에서 언제든 즉시 실행 가능
    inputs:
      dry_run:
        description: '이메일 발송 없이 대시보드 DB만 즉시 갱신 여부'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 모니터링 및 이메일 발송 실행
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          git pull --rebase origin main || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi

      - name: 확인 완료한 공고 및 서버 DB(seen_posts.json, docs/data.json) 업데이트 저장
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase --autostash origin main || true
          git add seen_posts.json docs/data.json
          git diff --staged --quiet || git commit -m "chore: update seen_posts and server data [skip ci]"
          git push
